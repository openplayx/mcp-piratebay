name: Tests

# OpenPlayX: the upstream workflow uploaded coverage to the original author's
# Codecov project; that step is removed. Only offline tests run here; no
# publishing, no credentials. Upstream version: see UPSTREAM.md.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Checks
      run: scripts/check.sh
